<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seykolig - Canlı Skor</title>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --header-red: #8B0000;
            --mackolik-yellow: #FFD700;
            --card-bg: #1e1e1e;
            --text-white: #ffffff;
            --text-grey: #999;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* --- AÇILIŞ EKRANI (SPLASH) --- */
        #splash-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--header-red);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: 0.5s;
        }
        #splash-screen h1 { color: var(--mackolik-yellow); font-size: 3rem; margin: 0; }

        /* --- ANA ARAYÜZ --- */
        .page { display: none; padding-bottom: 80px; }
        .page.active { display: block; }

        header {
            background: var(--header-red);
            padding: 15px; position: sticky; top: 0; z-index: 100;
        }

        .search-bar {
            background: #FFB300; border-radius: 8px;
            display: flex; align-items: center; padding: 8px 12px; margin-top: 10px;
        }
        .search-bar input {
            background: transparent; border: none; width: 100%; outline: none;
            color: #333; font-weight: bold;
        }

        /* --- LİG VE TAKIM LİSTELERİ --- */
        .list-item {
            display: flex; align-items: center; padding: 15px;
            border-bottom: 1px solid #222; background: var(--card-bg);
            margin-bottom: 2px;
        }
        .list-item img { width: 30px; height: 30px; margin-right: 15px; }
        .list-item .star { margin-left: auto; color: var(--text-grey); cursor: pointer; }
        .list-item .star.active { color: var(--mackolik-yellow); }

        /* --- MAÇ KARTLARI --- */
        .match-card {
            background: var(--card-bg); margin: 5px 0; padding: 15px;
            display: flex; align-items: center; border-left: 4px solid transparent;
        }
        .match-card.live { border-left-color: #ff3b30; }
        .match-time { width: 40px; color: #ff3b30; font-weight: bold; }
        .match-teams { flex-grow: 1; padding: 0 15px; }
        .score { color: var(--mackolik-yellow); font-weight: bold; }

        /* --- ALT MENÜ --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: #181818;
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid #333; z-index: 1000;
        }
        .nav-item { text-align: center; color: #888; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: var(--mackolik-yellow); }
        .nav-item i { display: block; font-size: 1.2rem; margin-bottom: 3px; }

        /* --- BİLDİRİM POPUP --- */
        #event-popup {
            position: fixed; top: 10%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 2px solid var(--mackolik-yellow);
            padding: 15px 30px; border-radius: 50px; z-index: 10000;
            display: none; text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. Açılış Ekranı -->
    <div id="splash-screen">
        <h1>SEYKOLİG</h1>
        <p>Yükleniyor...</p>
    </div>

    <!-- 2. Arama & Ligler Sayfası (image_5 ve image_7) -->
    <div id="search-page" class="page active">
        <header>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" placeholder="Takım, Lig, Oyuncu, Hakem">
                <span>🎤</span>
            </div>
        </header>
        <div class="content">
            <div class="list-item" onclick="showLive()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg">
                <span>Trendyol Süper Lig</span>
                <span class="star active">★</span>
            </div>
            <div class="list-item">
                <img src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg">
                <span>Premier Lig</span>
                <span class="star">★</span>
            </div>
            <!-- Diğer Ligler... -->
        </div>
    </div>

    <!-- 3. Canlı Skorlar Sayfası (image_8) -->
    <div id="live-page" class="page">
        <header style="text-align: center;">
            <h2 style="margin:0; color: var(--mackolik-yellow);">Canlı Sonuçlar</h2>
        </header>
        <div id="live-list">
            <!-- Maçlar buraya JS ile akacak -->
        </div>
    </div>

    <!-- Olay Bildirimi -->
    <div id="event-popup">
        <h2 id="event-type" style="margin:0; color:var(--mackolik-yellow)"></h2>
        <p id="event-detail" style="margin:5px 0 0 0; color:white"></p>
    </div>

    <audio id="goal-sound" src="https://www.myinstants.com/media/sounds/goal-sound.mp3"></audio>

    <!-- Alt Navigasyon -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('search-page')"><i>🔍</i><span>Arama</span></div>
        <div class="nav-item" onclick="switchPage('live-page')"><i>📡</i><span>Canlı</span></div>
        <div class="nav-item"><i>📋</i><span>Bülten</span></div>
        <div class="nav-item"><i>📊</i><span>Puan</span></div>
    </nav>

    <script>
        // --- GEÇİŞLER VE AÇILIŞ ---
        setTimeout(() => {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 500);
        }, 2000);

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // --- CANLI MAÇ SİMÜLASYONU (GERÇEK VERİ MANTIĞI) ---
        const liveMatches = [
            { id: 101, home: "Galatasaray", away: "Fenerbahçe", hScore: 1, aScore: 0, min: 42 },
            { id: 102, home: "Beşiktaş", away: "Trabzonspor", hScore: 2, aScore: 2, min: 88 }
        ];

        function renderMatches() {
            const list = document.getElementById('live-list');
            list.innerHTML = '';
            liveMatches.forEach(m => {
                list.innerHTML += `
                    <div class="match-card live">
                        <div class="match-time">${m.min}'</div>
                        <div class="match-teams">
                            <div>${m.home} <span class="score">${m.hScore}</span></div>
                            <div>${m.away} <span class="score">${m.aScore}</span></div>
                        </div>
                    </div>
                `;
            });
        }
        renderMatches();

        // --- BİLDİRİM SİSTEMİ (GOL, OFSAYT, VAR) ---
        function triggerEvent(type, detail) {
            const popup = document.getElementById('event-popup');
            document.getElementById('event-type').innerText = type;
            document.getElementById('event-detail').innerText = detail;
            
            popup.style.display = 'block';
            if(type === "GOOOOL!") document.getElementById('goal-sound').play();

            setTimeout(() => popup.style.display = 'none', 4000);
        }

        // Rastgele Olay Simülatörü (Gerçek API gelene kadar test için)
        setInterval(() => {
            const r = Math.random();
            if(r > 0.95) triggerEvent("GOOOOL!", "Galatasaray skor yaptı!");
            else if(r > 0.90) triggerEvent("VAR KONTROLÜ", "Potansiyel Penaltı...");
            else if(r > 0.85) triggerEvent("OFSAYT", "Icardi'nin golü iptal.");
        }, 8000);

    </script>
</body>
</html>
